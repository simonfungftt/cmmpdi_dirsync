status = error
name = PropertiesConfig

# Console appender
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %c{1}:%L - %m%n

# File appender
appender.file.type = RollingFile
appender.file.name = file
appender.file.fileName = logs/application.log
appender.file.filePattern = logs/application-%d{yyyy-MM-dd}-%i.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %c{1}:%L - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10

# Root logger
rootLogger.level = info
rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.file.ref = file

# Custom loggers
logger.controller.name = com.example.demo.controller
logger.controller.level = debug
logger.controller.appenderRef.console.ref = console
logger.controller.appenderRef.file.ref = file
logger.controller.additivity = false

logger.service.name = com.example.demo.service
logger.service.level = info
logger.service.appenderRef.console.ref = console
logger.service.appenderRef.file.ref = file
logger.service.additivity = false